<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de HTML con Formularios</title>
</head>
<body>
    <main>
        <h1>Formularios en HTML</h1>
        <form action="" method="post">
            <h2>Datos Personales</h2>
            <label for="name">Nombre:</label>
            <input type="text" name="name" id="">

            <label for="email">Correo Electrónico:</label>
            <input type="email" name="email" id="email">

            <label for="phone">Teléfono</label>
            <input type="tel" name="phone" id="phone">

            <h2>Género</h2>
            <input type="radio" name="maculino" id="maculino">
            <label>Maculino</label>

            <input type="radio" name="femenino" id="femenino">
            <label>Femenino</label>

            <input type="radio" name="otro" id="otro">
            <label>Otro</label>

            <h2>Preferencias</h2>
            <input type="checkbox" name="musica" id="musica">
            <label>Música</label>

            <input type="checkbox" name="deportes" id="deportes">
            <label>Deportes</label>
            
            <input type="checkbox" name="lectura" id="lectura">
            <label>Lectura</label>

            <h2>Comentarios</h2>
            <textarea name="" id="" cols="50" rows="5"></textarea>

            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
