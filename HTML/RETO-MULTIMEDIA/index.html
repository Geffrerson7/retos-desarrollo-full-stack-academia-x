<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimedia en HTML<</title>
  </head>
  <body>
    <main>
      <h1>Multimedia en HTML</h1>
      <h2>Audio</h2>
      <audio
        src="https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/6c/fc/4f/6cfc4f89-f9b9-590f-744f-49173af0d9de/mzaf_13370105221544142821.plus.aac.p.m4a"
        controls
      ></audio>
      <h2>Video</h2>
      <video controls width="320" height="240">
        <source
          src="./VideoDEVsafioDinamicaShowTheCode.mp4"
          type="video/mp4"
        />
      </video>
      <h2>Iframe</h2>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/xFGE8BuOn0g?si=Rha34l8vqLG5WuGK"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </main>
  </body>
</html>
